name: pr-artifacts

on:
  workflow_run:
    workflows: [generate-builds]
    types:
      - completed

# The workflow_run event executes in the base repository, so give this
# reporting workflow only the access needed to read artifacts and edit PR text.
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  pr-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - id: 'pr-number'
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const {owner, repo} = context.repo;
            const pullHeadSHA = '${{github.event.workflow_run.head_sha}}';
            const pullUserId = ${{github.event.sender.id}};
            const prNumber = await (async () => {
              for await (const { data } of github.paginate.iterator(
                github.rest.pulls.list, { owner, repo }
              )) {
                for (const pull of data) {
                  if (pull.head.sha === pullHeadSHA && pull.user.id === pullUserId) {
                    return pull.number;
                  }
                }
              }
            })();

            if (!prNumber) {
              return core.error(`No matching pull request found`);
            }

            return prNumber;
      - id: 'artifacts-text'
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            const distributables = allArtifacts.data.artifacts.filter(item =>
              item.name !== "soh.o2r" && !item.expired
            );
            if (distributables.length === 0) {
              core.notice('No distributable build artifacts found; skipping PR update.');
              return '';
            }
            return distributables.reduce((acc, item) => {
              acc += `
              - [${item.name}.zip](https://nightly.link/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${item.id}.zip)`;
              return acc;
            }, '### Build Artifacts');
      - id: 'add-to-pr'
        if: ${{ steps.artifacts-text.outputs.result != '' }}
        uses: garrettjoecox/pr-section@4.0.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pr-number: ${{ steps.pr-number.outputs.result }}
          section-name: 'artifacts'
          section-value: '${{ steps.artifacts-text.outputs.result }}'
